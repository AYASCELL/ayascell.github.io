<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5df9e"/>
      <stop offset="50%" stop-color="#d8b66c"/>
      <stop offset="100%" stop-color="#8a6e34"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="50%" stop-color="#f0d28a"/>
      <stop offset="100%" stop-color="#c99f4d"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2417"/>
      <stop offset="100%" stop-color="#11110f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f0d28a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Diamond -->
  <rect x="14" y="14" width="36" height="36" rx="5" transform="rotate(45 32 32)" fill="url(#bg-glow)" stroke="url(#gold-border)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Inner Diamond Accent -->
  <rect x="17" y="17" width="30" height="30" rx="3" transform="rotate(45 32 32)" fill="none" stroke="#d8b66c" stroke-width="0.75" stroke-opacity="0.4"/>
  <!-- Sculpted Serif A -->
  <text x="32" y="41" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="url(#gold-text)" text-anchor="middle">A</text>
</svg>
